services:
  iptv-multiview:
    build: .
    container_name: iptv-multiview
    restart: unless-stopped
    ports:
      - "1234:1234"
    environment:
      - TZ=America/Toronto
      # Recordings and downloads (kept until you delete them, no size cap): put this on a large, slow disk.
      - REC_DIR=/recordings
      # Rewind buffer (the last hour of every channel being watched, cleared at start): put this on a fast disk.
      # About 2 GB per hour per 4-5 Mbps channel, so a 6-tile multiview needs about 12 GB.
      - REWIND_DIR=/rewind
      # - REWIND_MINUTES=60           # 0 switches rewind off, up to 240
      # Create the first admin account at start (otherwise create it in the app: Logins > Users and logins).
      # Do this if anything other than your own LAN can reach this port:
      # - ADMIN_USER=james
      # - ADMIN_PASSWORD=change-this-password
      # Per-stream relay buffer in MB (about 10-20 s of an HD channel at 16):
      # Relay memory per channel in MB. 32 holds about a minute of an HD channel; a viewer who joins a channel that is
      # already running can start that far behind live. For 5 minute buffers use 256 and make sure the host has the RAM
      # (9 channels x 256 MB).
      # - RING_MB=32
      # Shared screen and 480p tile transcoding (see README). auto = GPU if /dev/dri is passed in, else CPU.
      # - COMPOSE_ENCODER=auto        # auto | vaapi | x264 | nvenc
      # - VAAPI_DEVICE=/dev/dri/renderD128   # use renderD129 to pick the other GPU
      # - COMPOSE_MAX=2               # shared screens running at once
      # - TRANSCODE_MAX=2             # 480p tile transcodes running at once
      # - TRANSCODE_ALLOW_CPU=1       # allow 480p tile transcoding on the CPU (off: GPU only)
    # Only for a local capture card (Providers > Add capture card) and/or a GPU encoder. Uncomment what you need
    # (list each device once), then restart the stack.
    # devices:
    #   - /dev/video0:/dev/video0
    #   - /dev/snd:/dev/snd
    #   - /dev/dri:/dev/dri
    volumes:
      # Named volume: Docker gives it the right owner automatically.
      # To use a folder instead:  - ./data:/data   (then run: mkdir data && chown 1000:1000 data)
      - ${DATA_PATH:-iptv-data}:/data  # set DATA_PATH to a host folder (e.g. /srv/iptv) or leave for the named volume
      - ${REC_PATH:-iptv-recordings}:/recordings  # set REC_PATH to a folder on a big disk (owned by uid 1000)
      - ${REWIND_PATH:-iptv-rewind}:/rewind       # set REWIND_PATH to a folder on a fast disk (owned by uid 1000)

volumes:
  iptv-data:
  iptv-recordings:
  iptv-rewind:
