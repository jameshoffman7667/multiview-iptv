plugins {
    id 'com.android.application'
}

// The release workflow passes the version (-PappVersion=0.15.0 -PappVersionCode=150000; versionCode = MAJOR*100000000 + MINOR*10000 + PATCH).
def appVersion = (project.findProperty('appVersion') ?: '0.0.0').toString()
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()

android {
    namespace 'app.iptvmultiview.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.iptvmultiview.tv'
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersion
        buildConfigField 'String', 'APP_VERSION', "\"${appVersion}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // The release key from the repository secrets. There is no debug-key fallback: without the key the build stops.
        release {
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

// Never a debug-signed (or unsigned) release APK: stop when the release key is not there.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'packageRelease' } && !System.getenv('ANDROID_KEYSTORE_FILE')) {
        throw new GradleException('ANDROID_KEYSTORE_FILE is not set: refusing to build a release APK without the release key (never debug-signed)')
    }
}

dependencies {
    // Local mode: a native player that pulls the provider's stream directly (also decodes AC-3 / E-AC-3 audio).
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    // Casting from phones and tablets with the Google Cast sender (the default media receiver).
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
}
