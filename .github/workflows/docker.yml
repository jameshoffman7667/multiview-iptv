name: Build and push image

# A release is a push to main that changes the version in package.json. The workflow reads X.Y.Z, checks that tag vX.Y.Z
# and its CHANGELOG entry are fine, builds and pushes the image (X.Y.Z, X.Y, latest), then `gh release create` makes the
# GitHub release and the tag vX.Y.Z at the pushed commit. Nothing needs a tag push.
# A tag v*.*.* pushed by hand is only a fallback; it is refused when the release already exists.
on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      android_only:
        description: "Only build and attach the Android app (skips the tests and the Docker image)"
        type: boolean
        default: false

# One release run at a time, so a push and a hand-pushed tag for the same version cannot both release it.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: mybadreligon/multiview-iptv

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      release: ${{ steps.m.outputs.release }}
      source: ${{ steps.m.outputs.source }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release-meta.sh

  test:
    needs: meta
    if: ${{ needs.meta.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ffmpeg for the capture-card test
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test

  image:
    needs: [meta, test]
    if: ${{ needs.meta.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.meta.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.meta.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub release (this also creates the tag when it does not exist yet)
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.meta.outputs.source }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v " " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "IPTV Multiview $VERSION" > notes.md
          if [ "$SOURCE" = tag ]; then
            gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
          fi
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # Android TV / Nvidia Shield app. Built after the image is published so a problem here never blocks the Docker release.
  android:
    needs: [meta, image]
    if: ${{ always() && (needs.image.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.android_only)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          VER="$(node -p "require('./package.json').version")"
          IFS=. read -r MA MI PA <<< "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licences (the runner image already has the SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Signing key (optional)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "Using the release signing key from repository secrets"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with the debug key (updates need the old app uninstalled first)"
          fi
      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleRelease -PappVersion=${{ steps.ver.outputs.version }} -PappVersionCode=${{ steps.ver.outputs.code }}
      - name: Attach to the GitHub release
        run: |
          VER="${{ steps.ver.outputs.version }}"
          cp android/app/build/outputs/apk/release/app-release.apk iptv-multiview.apk
          awk -v v="$VER" '$0 ~ "^## " v " " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "IPTV Multiview $VER" > notes.md
          printf '\nAndroid TV / Nvidia Shield app: `iptv-multiview.apk` (sideload it, see the README).\n' >> notes.md
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --target "$GITHUB_SHA" --title "v$VER" --notes-file notes.md
          gh release upload "v$VER" iptv-multiview.apk --clobber
