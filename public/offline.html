<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>IPTV Multiview - offline</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #e9ecf2; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; }
  img { width: 96px; height: 96px; }
  p { margin: 0; color: #9aa1b2; max-width: 30em; }
  button { font: inherit; color: inherit; padding: 10px 18px; border: 1px solid #4da3ff; border-radius: 8px; background: #1d4f86; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>IPTV Multiview needs a connection to your server to play channels. Check your network or that the server is running, then try again.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>document.getElementById('retry').addEventListener('click', function () { location.href = '/'; });
window.addEventListener('online', function () { location.href = '/'; });</script>
</body>
</html>
