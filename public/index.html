<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>IPTV Multiview</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="grid" class="grid"></div>

<div id="toolbar" class="toolbar">
  <div id="layouts" class="group" role="group" aria-label="Layout"></div>
  <span id="view-title" class="view-title"></span>
  <div class="spacer"></div>
  <button id="btn-views" class="btn" type="button" title="Shared multiviews">Multiviews</button>
  <button id="btn-audio" class="btn" type="button" title="Mute / unmute (M)">Sound</button>
  <button id="btn-conn" class="btn" type="button" title="Providers and connections">Providers</button>
  <button id="btn-settings" class="btn" type="button" title="Settings">Settings</button>
  <button id="btn-full" class="btn" type="button" title="Fullscreen (F)">Fullscreen</button>
  <button id="btn-acct" class="btn" type="button" title="Account" hidden>Account</button>
</div>

<div id="banner" class="banner" hidden></div>
<div id="hint" class="hint" hidden></div>

<script src="/vendor/mpegts.js"></script>
<script src="/app.js"></script>
</body>
</html>
